; =============================================================
; PHP config para es21plus
; @author Carlos Vico
; =============================================================

; Asegura que $_ENV se rellene desde el entorno del contenedor Docker
variables_order = "EGPCS"

; Encoding UTF-8
default_charset = "UTF-8"

; Mostrar errores en desarrollo
display_errors = On
error_reporting = E_ALL

; Subida de ficheros (subida masiva: hasta 100 imágenes × 2 MB)
file_uploads        = On
upload_max_filesize = 2M
post_max_size       = 220M
max_file_uploads    = 100
memory_limit        = 256M
max_execution_time  = 300
